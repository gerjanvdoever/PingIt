name: Run PingIt.Tests on Push

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET workloads (for MAUI)
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests for PingIt.Tests only
        run: dotnet test ./PingIt.Tests/PingIt.Tests.csproj --no-build --verbosity normal
