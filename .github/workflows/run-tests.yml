name: Run PingIt.Tests on Push

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Run PingIt.Tests on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore MAUI workloads
        run: dotnet workload restore

      - name: Restore and build
        run: dotnet restore PingIt.Tests/PingIt.Tests.csproj

      - name: Run tests
        run: dotnet test PingIt.Tests/PingIt.Tests.csproj --verbosity normal
